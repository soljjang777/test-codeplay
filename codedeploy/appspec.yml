version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/app
file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - file
      - directory

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: ubuntu

  BeforeInstall:
    - location: scripts/stop.sh
      timeout: 60
      runas: ubuntu

  AfterInstall:
    - location: scripts/start.sh
      timeout: 120
      runas: ubuntu

  ApplicationStart:
    - location: scripts/healthcheck.sh
      timeout: 120
      runas: ubuntu

  ValidateService:
    - location: scripts/healthcheck.sh
      timeout: 120
      runas: ubuntu
