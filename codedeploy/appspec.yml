version: 0.0
os: linux

files:
  - source: app/app.jar
    destination: /opt/app
    overwrite: true

permissions:
  - object: /opt/app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: "755"

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: ubuntu

  BeforeInstall:
    - location: scripts/stop.sh
      timeout: 60
      runas: ubuntu

  AfterInstall:
    - location: scripts/start.sh
      timeout: 120
      runas: ubuntu

  ApplicationStart:
    - location: scripts/healthcheck.sh
      timeout: 120
      runas: ubuntu

  ValidateService:
    - location: scripts/healthcheck.sh
      timeout: 120
      runas: ubuntu
